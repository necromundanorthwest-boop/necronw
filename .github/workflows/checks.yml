name: Check website and companion
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/necromund-ai/package-lock.json
      - run: npm ci
        working-directory: source/necromund-ai
      - run: npm test
        working-directory: source/necromund-ai
      - run: node scripts/build-site.mjs
      - run: npm install --prefix /tmp/browser-tests playwright@1.62.1
      - run: /tmp/browser-tests/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/site-smoke.cjs
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: /tmp/browser-tests/node_modules
      - run: node tests/event-play-smoke.cjs
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: /tmp/browser-tests/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: website-candidate
          path: public
